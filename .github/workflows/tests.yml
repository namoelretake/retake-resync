name: ReSync — testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: source/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements.txt
      - name: Disponibilizar FFmpeg para os testes
        run: |
          python -m pip install 'imageio-ffmpeg>=0.5,<1'
          mkdir -p "$RUNNER_TEMP/resync-bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/resync-bin/ffmpeg"
          echo "$RUNNER_TEMP/resync-bin" >> "$GITHUB_PATH"
      - name: Confirmar FFmpeg disponível
        run: ffmpeg -version
      - name: Executar testes
        env:
          RESYNC_CACHE_DIR: ${{ runner.temp }}/resync-test-cache
        run: python -m unittest discover -s source/tests -p 'test_*.py' -q
      - name: Medir desempenho com mídia sintética
        run: python build/benchmark_sync.py --scenario quick --output "$RUNNER_TEMP/resync-benchmark.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ReSync-sync-benchmark
          path: ${{ runner.temp }}/resync-benchmark.json

