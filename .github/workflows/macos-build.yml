name: ReSync — compilar macOS manualmente

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'source/index.html'
      - 'build/**'
      - 'assets/**'
      - '.github/workflows/macos-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-app:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Conferir ambiente
        run: |
          python3 --version
          uname -m
          xcrun --find swiftc
      - name: Instalar dependências dos testes
        run: python3 -m pip install -r source/requirements.txt
      - name: Disponibilizar FFmpeg para os testes
        run: |
          python -m pip install 'imageio-ffmpeg>=0.5,<1'
          mkdir -p "$RUNNER_TEMP/resync-bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/resync-bin/ffmpeg"
          echo "$RUNNER_TEMP/resync-bin" >> "$GITHUB_PATH"
      - name: Confirmar FFmpeg disponível
        run: ffmpeg -version
      - name: Testar motor antes da compilação
        run: python3 -m unittest discover -s source/tests -p 'test_*.py' -q
      - name: Compilar aplicativo experimental
        env:
          CI: 'true'
        run: bash 'build/Criar ReSync Completo.command'
      - name: Validar estrutura do aplicativo gerado
        run: |
          test -x saida/ReSync.app/Contents/MacOS/ReSync
          test -x saida/ReSync.app/Contents/Resources/backend/resync-server/resync-server
          test -x saida/ReSync.app/Contents/Resources/bin/ffmpeg
          ls -lh saida/ReSync-macOS.dmg || true
      - name: Disponibilizar artefatos não assinados
        uses: actions/upload-artifact@v4
        with:
          name: ReSync-macOS-unsigned
          path: |
            saida/ReSync.app
            saida/ReSync-macOS.dmg
          if-no-files-found: error

# Build manual para teste: pode consumir minutos cobrados no GitHub.
# macos-15 usa runner Intel; a versão nativa arm64 deve ser compilada em um Mac Apple Silicon.
# Não publica Release nem instala atualizações automaticamente.
