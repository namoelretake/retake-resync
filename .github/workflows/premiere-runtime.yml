name: ReSync — runtime Premiere experimental

# Desenvolvimento do motor embutido. Não publica release, plugin CCX ou appcast.
# Execução manual evita disputar runners ARM com a publicação do aplicativo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Conferir arquitetura
        run: test "$(uname -m)" = "arm64"
      - name: Instalar ferramentas de compilação
        run: python -m pip install -r source/requirements.txt 'pyinstaller>=6.5,<7' 'imageio-ffmpeg>=0.5,<1'
      - name: Compilar e testar motor sem ReSync.app
        run: |
          python build/build_premiere_runtime.py --output "$RUNNER_TEMP/resync-premiere-stage"
          python build/test_premiere_runtime.py "$RUNNER_TEMP/resync-premiere-stage/mac/arm64/runtime"
      - name: Empacotar runtime experimental
        run: |
          ditto -c -k --keepParent "$RUNNER_TEMP/resync-premiere-stage/mac" "$RUNNER_TEMP/ReSync-Premiere-Runtime-macOS-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ReSync-Premiere-Runtime-macOS-arm64-experimental
          path: ${{ runner.temp }}/ReSync-Premiere-Runtime-macOS-arm64.zip
          if-no-files-found: error
